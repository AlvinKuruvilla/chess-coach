[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-coach"
version = "0.1.0"
description = "An MCP server that explains why a chess move was bad, built against MCP revision 2026-07-28."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alvin Kuruvilla", email = "alvineasokuruvilla@gmail.com" },
]
dependencies = [
    "chess>=1.11.2",
    "mcp>=2.1.1",
]

[project.scripts]
chess_coach = "chess_coach.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "syrupy>=4",
    "ruff>=0.9",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chess_coach"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib (prefer pathlib.Path)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["chess_coach"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
# Tools are async because the engine is; auto mode saves marking every test.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
